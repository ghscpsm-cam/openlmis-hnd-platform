# Resolución del dominio público dentro de los contenedores cuando el DNS del servidor no lo
# conoce (DNS interno). Los servicios validan tokens contra BASE_URL, y nginx solo exime del rate
# limit las llamadas cuyo host es VIRTUAL_HOST, así que deben usar el dominio y no la IP.
# Se activa con OPENLMIS_HOST_ALIAS/OPENLMIS_HOST_IP en env/<env>.env; el default es inofensivo.
x-host-alias: &host-alias
  extra_hosts:
    - "${OPENLMIS_HOST_ALIAS:-openlmis-host-alias.invalid}:${OPENLMIS_HOST_IP:-127.0.0.1}"

services:
  nginx:
    environment:
      CLIENT_MAX_BODY_SIZE: "${CLIENT_MAX_BODY_SIZE:-50m}"
  reference-ui:
    image: "${REFERENCE_UI_IMAGE:-openlmis/reference-ui:5.2.12}"
    volumes: !reset []
    environment:
      LOCALE: "${LOCALE:-es}"
      COUNTRY: "${COUNTRY:-HN}"
      CURRENCY_CODE: "${CURRENCY_CODE:-HNL}"
      CURRENCY_SYMBOL: "${CURRENCY_SYMBOL:-L}"
      CURRENCY_LOCALE: "${CURRENCY_LOCALE:-HN}"
      TIME_ZONE: "${TIME_ZONE:-America/Tegucigalpa}"
  referencedata:
    <<: *host-alias
    environment:
      JAVA_OPTS: "-server -Xmx${REFERENCEDATA_XMX:-1536m} -Dlogging.config=/config/log/logback.xml"
    mem_limit: "${REFERENCEDATA_MEM_LIMIT:-2G}"
    cpus: "${REFERENCEDATA_CPUS:-2}"
  stockmanagement:
    <<: *host-alias
    # Imagen oficial con la Tarjeta de Almacén, el resumen de existencias y el inventario físico en español.
    image: "${STOCKMANAGEMENT_IMAGE:-openlmis/stockmanagement:5.3.0}"
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-server -Xmx${STOCKMANAGEMENT_XMX:-1536m} -Dlogging.config=/config/log/logback.xml"
      spring_profiles_active: production
    mem_limit: "${STOCKMANAGEMENT_MEM_LIMIT:-2G}"
    cpus: "${STOCKMANAGEMENT_CPUS:-2}"
  report:
    <<: *host-alias
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-server -Xmx${REPORT_XMX:-1536m} -Dlogging.config=/config/log/logback.xml"
    mem_limit: "${REPORT_MEM_LIMIT:-2G}"
    cpus: "${REPORT_CPUS:-2}"
  requisition:
    <<: *host-alias
  auth:
    <<: *host-alias
  notification:
    <<: *host-alias
  fulfillment:
    <<: *host-alias
  cce:
    <<: *host-alias
  buq:
    <<: *host-alias
  hapifhir:
    <<: *host-alias
  diagnostics:
    <<: *host-alias
  dhis2-integration:
    <<: *host-alias
